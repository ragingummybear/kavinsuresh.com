<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kavin Suresh</title>
<meta name="description" content="Poems by Kavin Suresh">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="name"><a href="#/">Kavin Suresh</a></div>
    <div class="tag">poems</div>
  </header>
  <main id="app"></main>
  <footer>&copy; <span id="yr"></span> Kavin Suresh</footer>
</div>

<script>
  // Load poems and page code fresh on every visit, so new poems show up right away
  // instead of waiting out the browser cache.
  (function load(files) {
    if (!files.length) return;
    const s = document.createElement("script");
    s.src = files[0] + "?v=" + Date.now();
    s.onload = () => load(files.slice(1));
    document.body.appendChild(s);
  })(["poems.js", "app.js"]);
</script>
</body>
</html>
